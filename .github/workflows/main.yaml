name: QR Gen CI

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set pending status
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          REPO: ${{ github.event.client_payload.repo }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$REPO/statuses/$SHA \
            -d '{
              "state":"pending",
              "context":"External CI",
              "description":"Running tests..."
            }'

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.CI_PAT }}

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make curl imagemagick mawk

      - name: Add magick symlink
        run: ln -sf "$(which convert)" /usr/local/bin/magick

      - name: Build release
        id: build
        run: make clean all CFLAGS="-Wall -Wextra -Wpedantic -Werror -I. -std=c2x -D_POSIX_C_SOURCE=200809L"

      - name: Run tests
        id: tests
        run: make test

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          REPO: ${{ github.event.client_payload.repo }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          STATE="success"
          DESC=()

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            STATE="failure"
            DESC+=("Build failed")
          fi

          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            STATE="failure"
            DESC+=("Tests failed")
          fi

          if [ "$STATE" = "success" ]; then
            DESC="Build and tests passed"
          fi

          MESSAGE=$(printf "%s; " "${DESC[0]}")
          MESSAGE=${MESSAGE%; }

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$REPO/statuses/$SHA \
            -d "{
              \"state\":\"$STATE\",
              \"context\":\"External CI\",
              \"description\":\"$MESSAGE\"
            }"
